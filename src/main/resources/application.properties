# ===========================
# Online Toy Store - Spring Boot Config
# ===========================

# Server port (default 8080)
server.port=8080

# ===========================
# JSP View Resolver
# ===========================
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

# ===========================
# MySQL DataSource
# (Used by DBConnection utility)
# Update credentials before running!
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/toy_store
spring.datasource.username=root
spring.datasource.password=Yasas1332@#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# File Storage for Orders, Reviews, Payments
# Files are stored in 'data/' folder inside project root
# ===========================
app.data.path=data

# Disable Spring Boot datasource auto-config
# (we use raw JDBC via DBConnection utility)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
